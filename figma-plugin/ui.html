<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="ax-studio-origin" content="http://localhost:4177"><style>html,body{margin:0;height:100%;font:12px Arial,sans-serif;background:#fafaf8}iframe{width:100%;height:100%;border:0}#notice{position:absolute;inset:0;padding:35px;display:flex;align-items:center;justify-content:center;background:#fafaf8;line-height:1.8;text-align:center}#notice[hidden]{display:none}button{padding:9px 16px;border:1px solid #ddd;background:white;border-radius:5px;cursor:pointer}</style></head><body>
<iframe id="receiver" title="AX Contents Studio Figma 연결" sandbox="allow-scripts allow-same-origin allow-forms"></iframe><div id="notice"><div><p id="message">스튜디오에 연결하고 있어요…</p><button id="retry" hidden>다시 연결</button></div></div>
<script>
const frame=document.getElementById('receiver'),origin=new URL(document.querySelector('meta[name="ax-studio-origin"]').content).origin;
const session=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
let latestContext=null,ready=false;
function host(action,data={}){frame.contentWindow.postMessage({...data,type:'ax-receiver-host',session,action},origin);}
window.addEventListener('message',event=>{
 if(event.source===frame.contentWindow&&event.origin===origin){
  const msg=event.data;
  if(msg?.type==='ax-receiver-loaded'){ready=true;document.getElementById('notice').hidden=true;parent.postMessage({pluginMessage:{type:'get-context',origin}},'*');return;}
  if(msg?.type!=='ax-receiver'||msg.session!==session)return;
  if(msg.action==='import')parent.postMessage({pluginMessage:{type:'import',requestId:msg.requestId,raw:msg.raw,arrangement:msg.arrangement,targetPageId:msg.targetPageId}},'*');
  if(['save-connection','save-receipt'].includes(msg.action))parent.postMessage({pluginMessage:{type:msg.action,origin,connection:msg.connection,jobId:msg.jobId,result:msg.result}},'*');
  return;
 }
 if(event.source!==parent)return;
 const msg=event.data?.pluginMessage;if(!msg)return;
 if(msg.type==='context'){latestContext=msg;host('context',msg);}
 else if(['success','error'].includes(msg.type))host('result',{requestId:msg.requestId,count:msg.count,error:msg.type==='error'?msg.message:null});
 else if(msg.type==='storage-error'){document.getElementById('notice').hidden=false;document.getElementById('message').textContent=msg.message;}
});
function openReceiver(){ready=false;document.getElementById('notice').hidden=false;document.getElementById('retry').hidden=true;frame.src=origin+'/figma-receiver.html';setTimeout(()=>{if(ready)return;document.getElementById('message').textContent='스튜디오에 연결하지 못했어요. '+origin+' 주소가 실행 중인지 확인해 주세요.';document.getElementById('retry').hidden=false;},15000);}
document.getElementById('retry').addEventListener('click',openReceiver);openReceiver();
</script></body></html>
