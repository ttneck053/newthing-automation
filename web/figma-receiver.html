<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/figma-receiver.css"><script src="/figma-client.js" defer></script><script src="/figma-receiver.js" defer></script></head><body>
<span class="eyebrow">뉴띵 카드뉴스 자동화</span><h1>웹앱에서 보내면<br>여기에 만들어져요.</h1>
<p id="account">Figma 계정을 확인하고 있어요…</p><div class="target"><span>받을 위치</span><strong id="destination">현재 파일 확인 중</strong><small id="page"></small></div>
<section id="pairing" hidden><p>웹앱의 <b>Figma 계정 연결</b>에 아래 코드를 입력하세요. 처음 한 번만 연결하면 돼요.</p><strong id="code"></strong><small>코드는 5분 동안 유효해요.</small></section>
<p id="status" role="status" aria-live="polite">연결 준비 중…</p><button id="reconnect" hidden>새 연결 코드 받기</button><button id="disconnect" hidden>계정 연결 해제</button><p class="hint">이 플러그인을 열어 두고 웹앱에서 “더 보기 → Figma로 보내기”을 누르세요. 문구·사진·도형이 편집 가능한 카드로 추가됩니다.</p>
</body></html>
